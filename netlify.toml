[build]
  # Clear Astro's content-layer store before building: the glob loader skips its
  # delete sweep when a collection goes to zero files, leaving stale pages on Netlify's cached node_modules.
  command = "rm -rf node_modules/.astro && npm run check && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The submission function imports the three question definitions from outside
# netlify/functions/, so esbuild inlines them into the bundle. This ships them
# as real files too: if bundling ever stops inlining JSON, an ENOENT at module
# scope would 500 every request, including the 403s that are meant to be cheap.
[functions]
  included_files = ["src/data/questionnaires/*.json"]

# Lighthouse runs as a build gate, not a one-time manual check: the
# thing being sold is ongoing competence, not launch-day competence.
#
# The thresholds are deliberately uneven. Accessibility and SEO are
# deterministic — the same bytes score the same every run — so they gate at a
# flat 1.0 and a drop there is a real mistake worth failing a deploy over.
# Performance and best-practices are not: the performance score moves a point
# or two run to run on identical output, and best-practices drops whenever
# Netlify's Chrome adds an API to its deprecation list. Both gated at 1.0 and
# both failed deploys on that noise, which trains you to ignore the gate. They
# sit low enough now to absorb the churn and still catch a genuine regression.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  # The string "true", not a boolean: the plugin compares
  # `inputs?.fail_deploy_on_score_thresholds === 'true'` to decide whether it
  # runs at onPostBuild (a real gate) or onSuccess (an alarm after the deploy
  # is already live). onSuccess also never writes output_path.
  [plugins.inputs]
    fail_deploy_on_score_thresholds = "true"

  # One audit per route in the final set. Reports are written into the publish
  # dir, so they are public on passing builds (robots.txt disallows /reports/).
  # On a failed gate the deploy is cancelled and no report ships; read the
  # failing-audit list in the deploy log.
  [[plugins.inputs.audits]]
    path = "index.html"
    output_path = "reports/lighthouse-home.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 1.0

  [[plugins.inputs.audits]]
    path = "packages/index.html"
    output_path = "reports/lighthouse-packages.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 1.0

  [[plugins.inputs.audits]]
    path = "how-it-works/index.html"
    output_path = "reports/lighthouse-how-it-works.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 1.0

  [[plugins.inputs.audits]]
    path = "faq/index.html"
    output_path = "reports/lighthouse-faq.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 1.0

  [[plugins.inputs.audits]]
    path = "start/index.html"
    output_path = "reports/lighthouse-start.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 1.0

  [[plugins.inputs.audits]]
    path = "questionnaire/intro/index.html"
    output_path = "reports/lighthouse-questionnaire-intro.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 1.0

  [[plugins.inputs.audits]]
    path = "questionnaire/brand/index.html"
    output_path = "reports/lighthouse-questionnaire-brand.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 1.0

  [[plugins.inputs.audits]]
    path = "questionnaire/build/index.html"
    output_path = "reports/lighthouse-questionnaire-build.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 1.0

  [[plugins.inputs.audits]]
    path = "office/login/index.html"
    output_path = "reports/lighthouse-office-login.html"
    [plugins.inputs.audits.thresholds]
      performance = 0.95
      accessibility = 1.0
      best-practices = 0.9
      seo = 0

[[redirects]]
  from = "/api/questionnaire"
  to = "/.netlify/functions/questionnaire"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/packages/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/start/"
  status = 301
  force = true

# /work/ is not generated until the collection has entries, so this
# points at the homepage for now. See README: "Turning on the Work
# page" for the activation steps that flip this to "/work/".
[[redirects]]
  from = "/portfolio"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

# DecapCMS loads from unpkg and talks to Netlify Identity, so /admin
# needs its own looser policy. The widening is scoped here only; the
# marketing pages stay locked down.
#
# Two blocks, identical values. The 200 rewrite above serves /admin from
# /admin/index.html, but header matching uses the path as requested, and
# "/admin" does not match the "/admin/*" glob. Without the exact-path block
# the bare URL falls through to the strict "/*" CSP and Decap's unpkg script
# is blocked at exactly the address people type.
[[headers]]
  for = "/admin"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; font-src 'self' data: https://unpkg.com; connect-src 'self' https://unpkg.com https://identity.netlify.com https://api.netlify.com https://api.github.com; frame-src https://identity.netlify.com; form-action 'self'; base-uri 'self'"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; font-src 'self' data: https://unpkg.com; connect-src 'self' https://unpkg.com https://identity.netlify.com https://api.netlify.com https://api.github.com; frame-src https://identity.netlify.com; form-action 'self'; base-uri 'self'"
    X-Frame-Options = "SAMEORIGIN"

# The design-direction demos under /demo are self-contained pages that
# hotlink Google Fonts and Unsplash photography, all of which the strict
# "/*" policy blocks. Without this widening they deploy looking unstyled
# and imageless. Scoped to /demo only; the marketing pages stay locked down.
#
# Unlike /admin, the bare "/demo" needs no second block: it has no 200
# rewrite, so Netlify 301s it to "/demo/" and the header matches the
# redirected path.
[[headers]]
  for = "/demo/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://images.unsplash.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Robots-Tag = "noindex, nofollow"

# Client questionnaires. Reachable only with a signed token, and never
# indexed: the pages are static, so the host serves the HTML to anyone with
# the URL and it is the submission that is gated.
[[headers]]
  for = "/questionnaire/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Only the prerendered login page gets these from here. Netlify applies
# netlify.toml headers to static files alone, so every server-rendered
# office response sets its own copy in src/middleware.ts.
[[headers]]
  for = "/office/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

# Astro content-hashes everything in /_astro, so it is safe to pin.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
